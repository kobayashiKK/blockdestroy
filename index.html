<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a1a">
<title>DOPAMINE BREAKER</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #05050f;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 30%, #1a1040 0%, #05050f 70%);
  }
  #game {
    display: block;
    touch-action: none;
    box-shadow: 0 0 60px rgba(120,80,255,0.4), 0 0 120px rgba(255,40,160,0.15);
    border-radius: 8px;
  }
  /* HUD */
  #hud {
    position: fixed; top: 0; left: 0; width: 100%;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 12px 16px; pointer-events: none; z-index: 10;
    font-weight: 800; color: #fff;
    text-shadow: 0 0 10px rgba(120,140,255,0.9);
  }
  #score { font-size: clamp(20px, 6vw, 34px); letter-spacing: 1px; }
  #score .lbl { font-size: 11px; opacity: 0.6; font-weight: 600; display:block; letter-spacing:2px;}
  #right { text-align: right; }
  #level { font-size: clamp(16px, 4vw, 22px); }
  #lives { font-size: clamp(18px, 5vw, 26px); margin-top: 4px; letter-spacing: 2px; }
  /* Combo popup */
  #combo {
    position: fixed; top: 18%; left: 50%; transform: translate(-50%,0) scale(0);
    z-index: 12; pointer-events: none; text-align: center;
    font-weight: 900; font-style: italic;
    color: #fff; opacity: 0;
  }
  #combo .num { font-size: clamp(40px, 14vw, 90px); line-height: 1;
    text-shadow: 0 0 20px #ff2e88, 0 0 40px #ff2e88; }
  #combo .txt { font-size: clamp(14px, 4vw, 22px); letter-spacing: 4px;
    text-shadow: 0 0 14px #ffd23f; color:#ffd23f; }
  /* Overlay screens */
  #overlay {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(5,5,15,0.82); backdrop-filter: blur(6px);
    text-align: center; padding: 24px;
  }
  #overlay.hidden { display: none; }
  #overlay h1 {
    font-size: clamp(38px, 13vw, 88px); font-weight: 900; font-style: italic;
    background: linear-gradient(90deg,#ff2e88,#ffd23f,#3fd2ff,#a25bff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 24px rgba(255,80,200,0.6));
    letter-spacing: 1px; line-height: 0.95; margin-bottom: 6px;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.04)} }
  #overlay h2 { font-size: clamp(22px,7vw,40px); color:#fff; margin-bottom: 10px;
    text-shadow:0 0 18px rgba(120,140,255,0.8); font-weight:800;}
  #overlay p { color: #b9bce0; font-size: clamp(13px,3.6vw,17px); margin-bottom: 26px; line-height:1.6;}
  #overlay .hi { color:#ffd23f; font-weight:800; }
  #btn {
    pointer-events: auto; cursor: pointer; border: none;
    padding: 16px 48px; font-size: clamp(18px,5vw,26px); font-weight: 900;
    color: #fff; border-radius: 999px; letter-spacing: 2px;
    background: linear-gradient(90deg,#ff2e88,#a25bff);
    box-shadow: 0 0 30px rgba(255,46,136,0.7), inset 0 0 14px rgba(255,255,255,0.25);
    transition: transform 0.1s, box-shadow 0.2s;
    animation: glow 1.4s ease-in-out infinite;
  }
  @keyframes glow { 0%,100%{box-shadow:0 0 30px rgba(255,46,136,0.7),inset 0 0 14px rgba(255,255,255,0.25)} 50%{box-shadow:0 0 50px rgba(162,91,255,0.9),inset 0 0 18px rgba(255,255,255,0.4)} }
  #btn:active { transform: scale(0.94); }
  #hint { color:#777aa8; font-size: 12px; margin-top: 20px; letter-spacing:1px;}
  #mute, #pauseBtn {
    position: fixed; bottom: 14px; z-index: 15;
    pointer-events:auto; cursor:pointer; background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.18); color:#fff; border-radius:50%;
    width:44px;height:44px;font-size:20px; display:flex;align-items:center;justify-content:center;
  }
  #mute { right: 16px; }
  #pauseBtn { left: 16px; font-size:18px; }
  /* Pause screen */
  #pauseScreen {
    position: fixed; inset: 0; z-index: 18;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(5,5,15,0.7); backdrop-filter: blur(5px); text-align:center;
  }
  #pauseScreen.hidden { display: none; }
  #pauseScreen h2 { font-size: clamp(30px,10vw,56px); font-weight:900; font-style:italic; color:#fff;
    text-shadow:0 0 22px rgba(120,140,255,0.9); margin-bottom:22px; letter-spacing:2px; }
  #resumeBtn {
    pointer-events: auto; cursor: pointer; border: none;
    padding: 16px 48px; font-size: clamp(18px,5vw,26px); font-weight: 900;
    color: #fff; border-radius: 999px; letter-spacing: 2px;
    background: linear-gradient(90deg,#ff2e88,#a25bff);
    box-shadow: 0 0 30px rgba(255,46,136,0.7), inset 0 0 14px rgba(255,255,255,0.25);
  }
  #resumeBtn:active { transform: scale(0.94); }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
</div>

<div id="hud">
  <div id="score"><span class="lbl">SCORE</span><span id="scoreVal">0</span></div>
  <div id="right">
    <div id="level">LV <span id="levelVal">1</span></div>
    <div id="lives">❤❤❤</div>
  </div>
</div>

<div id="combo"><div class="num">x2</div><div class="txt">COMBO</div></div>

<div id="overlay">
  <h1>DOPAMINE<br>BREAKER</h1>
  <p>ブロックを壊すと動物が笑顔に！🐾✨<br>連続ヒットでコンボ爆発 🔥 &nbsp; 🎯で狙って発射<br><span class="hi">PC:</span> マウス / ← → / P:一時停止 &nbsp;&nbsp; <span class="hi">スマホ:</span> 指でスライド</p>
  <button id="btn">▶ START</button>
  <div id="hint">タップ / クリックでも発射</div>
</div>

<button id="mute">🔊</button>
<button id="pauseBtn">⏸</button>

<div id="pauseScreen" class="hidden">
  <h2>⏸ PAUSED</h2>
  <button id="resumeBtn">▶ RESUME</button>
  <div id="hint">P / ESC / SPACE で再開</div>
</div>

<script>
(() => {
'use strict';

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const DPR = Math.min(window.devicePixelRatio || 1, 2);

// Logical playfield (portrait-friendly). We scale to fit screen.
let W = 480, H = 800;
let scale = 1, offX = 0, offY = 0;

function resize() {
  const vw = window.innerWidth, vh = window.innerHeight;
  // choose aspect: keep 3:5 ish but adapt
  const aspect = 3/5;
  let cw = vw, ch = vw / aspect;
  if (ch > vh) { ch = vh; cw = vh * aspect; }
  W = 480; H = Math.round(W / (cw/ch));
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  canvas.width = Math.round(cw * DPR);
  canvas.height = Math.round(ch * DPR);
  scale = canvas.width / W;
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
resize();

// ---------- Audio ----------
let audioCtx = null, muted = false;
function initAudio(){ if(!audioCtx){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }
function beep(freq, dur=0.08, type='square', vol=0.18){
  if(muted || !audioCtx) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t); o.stop(t+dur);
}
function noiseBurst(dur=0.15, vol=0.25){
  if(muted || !audioCtx) return;
  const t = audioCtx.currentTime;
  const buf = audioCtx.createBuffer(1, audioCtx.sampleRate*dur, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
  const src = audioCtx.createBufferSource(); src.buffer=buf;
  const g = audioCtx.createGain(); g.gain.value=vol;
  src.connect(g); g.connect(audioCtx.destination); src.start(t);
}

document.getElementById('mute').addEventListener('click', (e)=>{
  e.stopPropagation();
  muted = !muted;
  document.getElementById('mute').textContent = muted ? '🔇' : '🔊';
});

// ---------- Game state ----------
const COLORS = ['#ff2e88','#ff7b2e','#ffd23f','#46ff9c','#3fd2ff','#a25bff'];
let state = 'menu'; // menu, play, dead, win
let score = 0, hiScore = +(localStorage.getItem('db_hi')||0), level = 1, lives = 3;
let combo = 0, comboTimer = 0;
let shake = 0, flash = 0, flashColor = '255,255,255';
let particles = [], floaters = [], powerups = [], balls = [], bricks = [];
let trail = [];
let bgHue = 0;
let regionTop = 84, regionBottom = 400, currentAnimal = null, revealTimer = 0;

const paddle = { w: 90, h: 14, x: W/2, y: H-50, targetX: W/2 };
let paused = false;
let catchArmed = 0;                 // pending "catch & aim" launches from power-up
let aiming = false, aimAngle = -Math.PI/2, aimDir = 1; // aiming arrow oscillation

function makeBall(x,y,vx,vy){ return {x,y,vx,vy,r:8,fire:0,pierce:0,held:false}; }

// ---------- Hidden animal pictures (drawn with canvas) ----------
// Two layers: FRONT = neutral face shown on intact bricks,
//             BACK  = big healing smile revealed as bricks break.
const PICH = 800;            // logical playfield height (constant given fixed aspect)
const PSCALE = 2;            // supersample for crisp artwork
function mkPic(){ const c=document.createElement('canvas'); c.width=W*PSCALE; c.height=PICH*PSCALE; return c; }
const picFront = mkPic(), picBack = mkPic();
const fctx = picFront.getContext('2d'), bctx = picBack.getContext('2d');

// small drawing helpers (operate on a given context)
function tri(g,x1,y1,x2,y2,x3,y3){ g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2,y2); g.lineTo(x3,y3); g.closePath(); g.fill(); }
function blob(g,x,y,rx,ry,col){ g.fillStyle=col; g.beginPath(); g.ellipse(x,y,rx,ry,0,0,Math.PI*2); g.fill(); }
function eye(g,x,y,r){ g.fillStyle='#2b2b2b'; g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fill();
  g.fillStyle='#fff'; g.beginPath(); g.arc(x-r*0.3,y-r*0.35,r*0.4,0,Math.PI*2); g.fill(); }
function blush(g,x,y,r){ g.fillStyle='rgba(255,120,150,0.5)'; g.beginPath(); g.ellipse(x,y,r,r*0.6,0,0,Math.PI*2); g.fill(); }
// happy closed eye (⌒) for the smiling expression
function happyEye(g,x,y,r,col){ g.strokeStyle=col||'#2b2b2b'; g.lineWidth=r*0.42; g.lineCap='round';
  g.beginPath(); g.arc(x,y+r*0.35,r,Math.PI*1.18,Math.PI*1.82); g.stroke(); }
// open smiling mouth (∪)
function smileMouth(g,x,y,w,col){ g.strokeStyle=col||'#a55'; g.lineWidth=w*0.16; g.lineCap='round';
  g.beginPath(); g.arc(x,y,w,0.15*Math.PI,0.85*Math.PI); g.stroke(); }
// pick eyes: neutral or happy
function eyes(g,lx,rx,ey,r,smile,col){ if(smile){ happyEye(g,lx,ey,r,col); happyEye(g,rx,ey,r,col); }
  else { eye(g,lx,ey,r); eye(g,rx,ey,r); } }

function catDraw(g,cx,cy,s,smile){
  const c='#f4a259', ic='#ffd9b0';
  g.fillStyle=c;
  tri(g,cx-s*0.78,cy-s*0.35,cx-s*0.55,cy-s*1.05,cx-s*0.12,cy-s*0.55);
  tri(g,cx+s*0.78,cy-s*0.35,cx+s*0.55,cy-s*1.05,cx+s*0.12,cy-s*0.55);
  g.fillStyle=ic;
  tri(g,cx-s*0.6,cy-s*0.42,cx-s*0.5,cy-s*0.85,cx-s*0.28,cy-s*0.52);
  tri(g,cx+s*0.6,cy-s*0.42,cx+s*0.5,cy-s*0.85,cx+s*0.28,cy-s*0.52);
  blob(g,cx,cy,s,s*0.86,c);
  eyes(g,cx-s*0.36,cx+s*0.36,cy-s*0.02,s*0.15,smile);
  blush(g,cx-s*0.55,cy+s*0.28,s*(smile?0.24:0.18)); blush(g,cx+s*0.55,cy+s*0.28,s*(smile?0.24:0.18));
  g.fillStyle='#e26d8a'; tri(g,cx-s*0.08,cy+s*0.18,cx+s*0.08,cy+s*0.18,cx,cy+s*0.3);
  if(smile) smileMouth(g,cx,cy+s*0.32,s*0.2,'#b5654a');
  g.strokeStyle='#5b3a25'; g.lineWidth=s*0.035; g.lineCap='round';
  for(const d of [-1,1]){
    g.beginPath(); g.moveTo(cx+d*s*0.18,cy+s*0.26); g.lineTo(cx+d*s*0.72,cy+s*0.16); g.stroke();
    g.beginPath(); g.moveTo(cx+d*s*0.18,cy+s*0.32); g.lineTo(cx+d*s*0.74,cy+s*0.38); g.stroke();
  }
}
function dogDraw(g,cx,cy,s,smile){
  const c='#c08a52';
  blob(g,cx-s*0.82,cy-s*0.05,s*0.3,s*0.62,'#6e4a2b');
  blob(g,cx+s*0.82,cy-s*0.05,s*0.3,s*0.62,'#6e4a2b');
  blob(g,cx,cy,s,s*0.86,c);
  blob(g,cx,cy+s*0.35,s*0.5,s*0.4,'#f0e0c8');
  eyes(g,cx-s*0.32,cx+s*0.32,cy-s*0.1,s*0.14,smile);
  blob(g,cx,cy+s*0.18,s*0.13,s*0.1,'#3a2a20');
  g.strokeStyle='#3a2a20'; g.lineWidth=s*0.04; g.lineCap='round';
  if(smile){
    g.beginPath(); g.moveTo(cx,cy+s*0.28); g.lineTo(cx,cy+s*0.36); g.stroke();
    smileMouth(g,cx,cy+s*0.4,s*0.22,'#7a4a3a');
    g.fillStyle='#e8607a'; blob(g,cx,cy+s*0.5,s*0.11,s*0.08,'#e8607a'); // tongue
  } else {
    g.beginPath(); g.moveTo(cx,cy+s*0.26); g.lineTo(cx,cy+s*0.46); g.stroke();
  }
  blush(g,cx-s*0.55,cy+s*0.18,s*(smile?0.22:0.16)); blush(g,cx+s*0.55,cy+s*0.18,s*(smile?0.22:0.16));
}
function rabbitDraw(g,cx,cy,s,smile){
  const c='#fdfdff', ic='#ffc6da';
  blob(g,cx-s*0.32,cy-s*0.95,s*0.18,s*0.62,c);
  blob(g,cx+s*0.32,cy-s*0.95,s*0.18,s*0.62,c);
  blob(g,cx-s*0.32,cy-s*0.95,s*0.09,s*0.46,ic);
  blob(g,cx+s*0.32,cy-s*0.95,s*0.09,s*0.46,ic);
  blob(g,cx,cy,s*0.92,s*0.86,c);
  eyes(g,cx-s*0.34,cx+s*0.34,cy-s*0.02,s*0.14,smile);
  g.fillStyle='#e26d8a'; tri(g,cx-s*0.07,cy+s*0.16,cx+s*0.07,cy+s*0.16,cx,cy+s*0.27);
  if(smile) smileMouth(g,cx,cy+s*0.3,s*0.18,'#c25a78');
  blush(g,cx-s*0.52,cy+s*0.26,s*(smile?0.22:0.16)); blush(g,cx+s*0.52,cy+s*0.26,s*(smile?0.22:0.16));
}
function bearDraw(g,cx,cy,s,smile){
  const c='#b0814c';
  blob(g,cx-s*0.62,cy-s*0.68,s*0.32,s*0.32,c);
  blob(g,cx+s*0.62,cy-s*0.68,s*0.32,s*0.32,c);
  blob(g,cx-s*0.62,cy-s*0.68,s*0.16,s*0.16,'#d8b88a');
  blob(g,cx+s*0.62,cy-s*0.68,s*0.16,s*0.16,'#d8b88a');
  blob(g,cx,cy,s,s*0.92,c);
  blob(g,cx,cy+s*0.28,s*0.46,s*0.38,'#e6cda6');
  eyes(g,cx-s*0.3,cx+s*0.3,cy-s*0.08,s*0.13,smile);
  blob(g,cx,cy+s*0.16,s*0.12,s*0.09,'#3a2a20');
  if(smile){ smileMouth(g,cx,cy+s*0.3,s*0.2,'#7a5535'); blush(g,cx-s*0.5,cy+s*0.18,s*0.2); blush(g,cx+s*0.5,cy+s*0.18,s*0.2); }
}
function pandaDraw(g,cx,cy,s,smile){
  blob(g,cx-s*0.6,cy-s*0.66,s*0.28,s*0.28,'#2b2b2b');
  blob(g,cx+s*0.6,cy-s*0.66,s*0.28,s*0.28,'#2b2b2b');
  blob(g,cx,cy,s,s*0.9,'#fff');
  g.fillStyle='#2b2b2b';
  g.beginPath(); g.ellipse(cx-s*0.34,cy-s*0.02,s*0.2,s*0.27,-0.3,0,Math.PI*2); g.fill();
  g.beginPath(); g.ellipse(cx+s*0.34,cy-s*0.02,s*0.2,s*0.27,0.3,0,Math.PI*2); g.fill();
  eyes(g,cx-s*0.34,cx+s*0.34,cy-s*0.02,s*0.1,smile,'#fff');
  blob(g,cx,cy+s*0.2,s*0.1,s*0.08,'#2b2b2b');
  if(smile){ smileMouth(g,cx,cy+s*0.32,s*0.18,'#6a4a3a'); blush(g,cx-s*0.62,cy+s*0.14,s*0.18); blush(g,cx+s*0.62,cy+s*0.14,s*0.18); }
}
function frogDraw(g,cx,cy,s,smile){
  const c='#7ac74f';
  blob(g,cx,cy+s*0.05,s,s*0.78,c);
  blob(g,cx-s*0.42,cy-s*0.55,s*0.3,s*0.3,c);
  blob(g,cx+s*0.42,cy-s*0.55,s*0.3,s*0.3,c);
  g.fillStyle='#fff'; g.beginPath(); g.arc(cx-s*0.42,cy-s*0.6,s*0.16,0,7); g.fill();
  g.beginPath(); g.arc(cx+s*0.42,cy-s*0.6,s*0.16,0,7); g.fill();
  if(smile){ happyEye(g,cx-s*0.42,cy-s*0.6,s*0.12); happyEye(g,cx+s*0.42,cy-s*0.6,s*0.12); }
  else { g.fillStyle='#222'; g.beginPath(); g.arc(cx-s*0.42,cy-s*0.58,s*0.08,0,7); g.fill();
    g.beginPath(); g.arc(cx+s*0.42,cy-s*0.58,s*0.08,0,7); g.fill(); }
  g.strokeStyle='#3a7a22'; g.lineWidth=s*0.05; g.lineCap='round';
  g.beginPath(); g.arc(cx,cy+(smile?s*0.0:s*0.1),s*(smile?0.6:0.5),0.12*Math.PI,0.88*Math.PI); g.stroke();
  blush(g,cx-s*0.55,cy+s*0.22,s*(smile?0.22:0.16)); blush(g,cx+s*0.55,cy+s*0.22,s*(smile?0.22:0.16));
}
function pigDraw(g,cx,cy,s,smile){
  const c='#f7a9c4';
  g.fillStyle=c;
  tri(g,cx-s*0.7,cy-s*0.5,cx-s*0.4,cy-s*0.95,cx-s*0.2,cy-s*0.5);
  tri(g,cx+s*0.7,cy-s*0.5,cx+s*0.4,cy-s*0.95,cx+s*0.2,cy-s*0.5);
  blob(g,cx,cy,s,s*0.86,c);
  if(smile) smileMouth(g,cx,cy+s*0.36,s*0.18,'#c25a80');
  blob(g,cx,cy+s*0.22,s*0.34,s*0.26,'#ef8fb0');
  blob(g,cx-s*0.12,cy+s*0.22,s*0.06,s*0.09,'#c45b80');
  blob(g,cx+s*0.12,cy+s*0.22,s*0.06,s*0.09,'#c45b80');
  eyes(g,cx-s*0.32,cx+s*0.32,cy-s*0.1,s*0.13,smile);
  blush(g,cx-s*0.55,cy+s*0.12,s*(smile?0.22:0.16)); blush(g,cx+s*0.55,cy+s*0.12,s*(smile?0.22:0.16));
}
function chickDraw(g,cx,cy,s,smile){
  const c='#ffd23f';
  g.fillStyle=c; tri(g,cx-s*0.12,cy-s*0.78,cx+s*0.12,cy-s*0.78,cx,cy-s*1.05);
  blob(g,cx,cy,s,s*0.9,c);
  eyes(g,cx-s*0.28,cx+s*0.28,cy-s*0.1,s*0.13,smile);
  g.fillStyle='#ff9f1c';
  if(smile){ // open happy beak
    tri(g,cx-s*0.14,cy+s*0.06,cx+s*0.14,cy+s*0.06,cx,cy-s*0.04);
    tri(g,cx-s*0.14,cy+s*0.08,cx+s*0.14,cy+s*0.08,cx,cy+s*0.32);
  } else {
    tri(g,cx-s*0.12,cy+s*0.08,cx+s*0.12,cy+s*0.08,cx,cy+s*0.3);
  }
  blush(g,cx-s*0.5,cy+s*0.2,s*(smile?0.21:0.15)); blush(g,cx+s*0.5,cy+s*0.2,s*(smile?0.21:0.15));
}

const ANIMALS = [
  {name:'ねこ',   bg:'#fff3e0', bg2:'#ffe2ec', draw:catDraw},
  {name:'いぬ',   bg:'#fff1de', bg2:'#ffe9cf', draw:dogDraw},
  {name:'うさぎ', bg:'#fdf0f6', bg2:'#eef3ff', draw:rabbitDraw},
  {name:'くま',   bg:'#fff4e2', bg2:'#ffeccf', draw:bearDraw},
  {name:'ぱんだ', bg:'#eef4ff', bg2:'#f5f5f5', draw:pandaDraw},
  {name:'かえる', bg:'#eafff0', bg2:'#e2f7ff', draw:frogDraw},
  {name:'ぶた',   bg:'#fff0f5', bg2:'#ffe6f0', draw:pigDraw},
  {name:'ひよこ', bg:'#fffbe0', bg2:'#fff4d6', draw:chickDraw},
];

function renderAnimal(an){
  const cx = W/2, cy = (regionTop+regionBottom)/2, s = (regionBottom-regionTop)*0.46;
  for(const [g, smile] of [[fctx,false],[bctx,true]]){
    g.setTransform(PSCALE,0,0,PSCALE,0,0);
    g.clearRect(0,0,W,PICH);
    const bd = g.createRadialGradient(cx,cy,s*0.2,cx,cy,s*1.9);
    // back (smile) gets a warmer, brighter glow for the "healing" payoff
    bd.addColorStop(0, smile ? '#fffdf2' : an.bg);
    bd.addColorStop(1, smile ? an.bg : an.bg2);
    g.fillStyle = bd;
    g.fillRect(0, regionTop-12, W, (regionBottom-regionTop)+24);
    an.draw(g, cx, cy, s, smile);
  }
}

function buildLevel(lv){
  bricks = [];
  const cols = 7;
  const rows = Math.min(4 + lv, 9);
  const gap = 6;
  const top = 90;
  const bw = (W - gap*(cols+1)) / cols;
  const bh = 24;
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      // some gaps for variety on higher levels
      if(lv>2 && Math.random()<0.08) continue;
      const hp = 1 + (Math.random()< (lv*0.06) ? 1 : 0) + (r<1 && lv>3 ? 1:0);
      bricks.push({
        x: gap + c*(bw+gap), y: top + r*(bh+gap),
        w: bw, h: bh, hp, maxhp: hp,
        color: COLORS[(r+c)%COLORS.length],
        alive: true
      });
    }
  }
  regionTop = top - 6;
  regionBottom = top + (rows-1)*(bh+gap) + bh + 6;
  currentAnimal = ANIMALS[(lv-1) % ANIMALS.length];
  renderAnimal(currentAnimal);
}

function resetBallOnPaddle(){
  const b = makeBall(paddle.x, paddle.y - 16, 0, 0);
  b.held = true;
  balls = [ b ];
  aiming = true; aimAngle = -Math.PI/2; aimDir = 1;  // serve is aimable too
}

function startGame(){
  initAudio();
  if(audioCtx && audioCtx.state==='suspended') audioCtx.resume();
  score = 0; level = 1; lives = 3; combo = 0;
  particles=[]; floaters=[]; powerups=[]; trail=[];
  paused = false; catchArmed = 0;
  document.getElementById('pauseScreen').classList.add('hidden');
  paddle.w = 90; paddle.x = paddle.targetX = W/2;
  buildLevel(level);
  resetBallOnPaddle();
  state = 'play';
  document.getElementById('overlay').classList.add('hidden');
  updateHUD();
}

function nextLevel(){
  level++;
  paddle.w = Math.max(60, paddle.w);
  buildLevel(level);
  resetBallOnPaddle();
  state = 'play';
  bigFloater('LEVEL '+level+'!', W/2, H/2, '#3fd2ff');
  flash = 0.6; flashColor='80,220,255';
  for(let i=0;i<60;i++) spawnParticle(Math.random()*W, Math.random()*H*0.6, COLORS[i%6], 6);
  beep(523,0.1); setTimeout(()=>beep(659,0.1),80); setTimeout(()=>beep(880,0.15),160);
}

function startReveal(){

  balls = []; powerups = []; combo = 0;
  flash = 0.6; flashColor = '255,210,63';
  bigFloater('CLEAR!', W/2, regionTop - 18, '#ffd23f');

  noiseBurst(0.2, 0.2);
  beep(523,0.1); setTimeout(()=>beep(659,0.1),100); setTimeout(()=>beep(784,0.1),200); setTimeout(()=>beep(1047,0.2),300);
  const cy = (regionTop+regionBottom)/2;
  for(let i=0;i<60;i++) spawnParticle(W*0.2+Math.random()*W*0.6, cy, COLORS[i%6], 1, 8);

// ---------- Effects ----------
function spawnParticle(x,y,color,count=8,speed=4){
  for(let i=0;i<count;i++){
    const a = Math.random()*Math.PI*2;
    const s = (0.4+Math.random())*speed;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s - 1,
      life:1, color, size: 2+Math.random()*4});
  }
}
function bigFloater(text,x,y,color){
  floaters.push({text,x,y,color,life:1,vy:-0.6,scale:0, big:true});
}
function smallFloater(text,x,y,color){
  floaters.push({text,x,y,color,life:1,vy:-1.2,scale:1, big:false});
}

function showCombo(n){
  const el = document.getElementById('combo');
  el.querySelector('.num').textContent = 'x'+n;
  el.style.transition='none';
  el.style.opacity='1';
  el.style.transform='translate(-50%,0) scale(1.4) rotate('+((Math.random()*8-4))+'deg)';
  // force reflow
  void el.offsetWidth;
  el.style.transition='transform 0.5s cubic-bezier(.2,1.4,.4,1), opacity 0.6s';
  el.style.transform='translate(-50%,0) scale(1) rotate(0deg)';
  el.style.opacity='0';
}

// ---------- Input ----------
function pointerX(clientX){
  const rect = canvas.getBoundingClientRect();
  return ((clientX - rect.left) / rect.width) * W;
}
function onMove(clientX){
  if(paused) return;
  paddle.targetX = Math.max(paddle.w/2, Math.min(W-paddle.w/2, pointerX(clientX)));
}
function launch(){
  if(state!=='play' || paused) return;
  const sp = 6.2 + level*0.15;
  let fired = false;
  for(const b of balls){
    if(b.held){ b.held=false; b.vx=Math.cos(aimAngle)*sp; b.vy=Math.sin(aimAngle)*sp; fired=true; }
  }
  if(fired){
    aiming = false;
    beep(660,0.06,'sawtooth',0.12);
    spawnParticle(paddle.x, paddle.y-16, '#fff', 8, 5);
  }
}

canvas.addEventListener('mousemove', e=> onMove(e.clientX));
canvas.addEventListener('mousedown', e=>{ initAudio(); onMove(e.clientX); launch(); });
canvas.addEventListener('touchstart', e=>{ e.preventDefault(); initAudio(); onMove(e.touches[0].clientX); launch(); }, {passive:false});
canvas.addEventListener('touchmove', e=>{ e.preventDefault(); onMove(e.touches[0].clientX); }, {passive:false});

let keyL=false, keyR=false;
window.addEventListener('keydown', e=>{
  if(e.key==='ArrowLeft'||e.key==='a') keyL=true;
  if(e.key==='ArrowRight'||e.key==='d') keyR=true;
  if(e.key==='p'||e.key==='P'||e.key==='Escape'){ e.preventDefault(); togglePause(); }
  if(e.key===' '){ e.preventDefault();
    if(paused){ togglePause(false); }
    else if(state==='play'){ launch(); }
    else { const b=document.getElementById('btn'); if(b) b.click(); }
  }
});
window.addEventListener('keyup', e=>{
  if(e.key==='ArrowLeft'||e.key==='a') keyL=false;
  if(e.key==='ArrowRight'||e.key==='d') keyR=false;
});

document.getElementById('btn').addEventListener('click', ()=>{ startGame(); });

// ---------- Pause ----------
function togglePause(force){
  if(state!=='play') { paused=false; document.getElementById('pauseScreen').classList.add('hidden'); return; }
  paused = (force===undefined) ? !paused : force;
  document.getElementById('pauseScreen').classList.toggle('hidden', !paused);
  if(!paused && audioCtx && audioCtx.state==='suspended') audioCtx.resume();
}
document.getElementById('pauseBtn').addEventListener('click', (e)=>{ e.stopPropagation(); togglePause(); });
document.getElementById('resumeBtn').addEventListener('click', (e)=>{ e.stopPropagation(); togglePause(false); });

// ---------- HUD ----------
function updateHUD(){
  document.getElementById('scoreVal').textContent = score.toLocaleString();
  document.getElementById('levelVal').textContent = level;
  document.getElementById('lives').textContent = '❤'.repeat(Math.max(0,lives)) || '💀';

// ---------- Powerups ----------
const PTYPES = ['wide','multi','fire','slow','catch','pierce'];
const MAX_BALLS = 40;
function maybeDropPowerup(x,y){
  if(Math.random()<0.12){
    const t = PTYPES[(Math.random()*PTYPES.length)|0];
    powerups.push({x,y,vy:2.2,type:t,r:13,life:1});
  }
}
function applyPowerup(t){
  if(t==='wide'){ paddle.w = Math.min(180, paddle.w+34); bigFloater('WIDE!',paddle.x,paddle.y-30,'#46ff9c'); }
  else if(t==='multi'){
    const extra=[];
    // each active ball splits into 3 (×3 multiplication)
    balls.forEach(b=>{ if(b.held) return; for(let k=0;k<3;k++){
      const a=Math.random()*Math.PI*2; const sp=Math.hypot(b.vx,b.vy)||6.5;
      const nb=makeBall(b.x,b.y,Math.cos(a)*sp,-Math.abs(Math.sin(a)*sp)-2);
      nb.fire=b.fire; nb.pierce=b.pierce; extra.push(nb);
    }});
    // if all balls were held (e.g. on serve), still spawn a few live ones
    if(extra.length===0 && balls.length){ const b=balls[0];
      for(let k=0;k<3;k++){ const a=Math.random()*Math.PI*2; extra.push(makeBall(b.x,b.y,Math.cos(a)*6.5,-Math.abs(Math.sin(a)*6.5)-2)); }
    }
    balls = balls.concat(extra).slice(0, MAX_BALLS);
    bigFloater('MULTI BALL!',W/2,H/2,'#ffd23f');
    for(let i=0;i<24;i++) spawnParticle(W/2,H/2,COLORS[i%6],1,7);
  }
  else if(t==='fire'){ balls.forEach(b=>b.fire=1); bigFloater('FIRE BALL!',W/2,H/2,'#ff7b2e'); }
  else if(t==='pierce'){ balls.forEach(b=>b.pierce=1); bigFloater('PIERCE! 貫通',W/2,H/2,'#3fd2ff');
    for(let i=0;i<18;i++) spawnParticle(W/2,H*0.5,'#3fd2ff',1,7); }
  else if(t==='slow'){ balls.forEach(b=>{ b.vx*=0.7; b.vy*=0.7; }); bigFloater('SLOW-MO',paddle.x,paddle.y-30,'#3fd2ff'); }
  else if(t==='catch'){ catchArmed++; bigFloater('CATCH! ねらって発射',W/2,paddle.y-40,'#ff5bd0'); }
  flash=0.4; flashColor='255,255,255';
  beep(880,0.1,'sine',0.2); setTimeout(()=>beep(1320,0.12,'sine',0.2),60);
}
function powerColor(t){ return {wide:'#46ff9c',multi:'#ffd23f',fire:'#ff7b2e',slow:'#3fd2ff',catch:'#ff5bd0',pierce:'#3fd2ff'}[t]; }
function powerIcon(t){ return {wide:'↔',multi:'✦',fire:'🔥',slow:'🐢',catch:'🎯',pierce:'⚡'}[t]; }

// ---------- Update ----------
function update(dt){
  if(paused) return;
  bgHue = (bgHue + 0.2) % 360;

  // paddle keyboard
  if(keyL) paddle.targetX -= 8;
  if(keyR) paddle.targetX += 8;
  paddle.targetX = Math.max(paddle.w/2, Math.min(W-paddle.w/2, paddle.targetX));
  paddle.x += (paddle.targetX - paddle.x) * 0.35;

  if(state==='reveal'){
    revealTimer -= dt;
    if(Math.random()<0.4){
      const x = regionTop && (W*0.15 + Math.random()*W*0.7);
      spawnParticle(x, regionTop + Math.random()*(regionBottom-regionTop), COLORS[(Math.random()*6)|0], 1, 5);
    }
    if(revealTimer<=0) nextLevel();
    decayEffects(); return;
  }
  if(state!=='play'){ decayEffects(); return; }

  // aiming arrow oscillation while a ball is held on the paddle
  if(aiming){
    aimAngle += aimDir*0.022;
    const lo = -Math.PI/2 - 1.05, hi = -Math.PI/2 + 1.05;
    if(aimAngle > hi){ aimAngle = hi; aimDir = -1; }
    if(aimAngle < lo){ aimAngle = lo; aimDir = 1; }
  }

  // combo timer
  if(comboTimer>0){ comboTimer -= dt; if(comboTimer<=0) combo=0; }

  // balls
  for(let i=balls.length-1;i>=0;i--){
    const b = balls[i];
    if(b.held){ b.x = paddle.x; b.y = paddle.y-16; continue; }

    b.x += b.vx; b.y += b.vy;

    // trail
    trail.push({x:b.x,y:b.y,life:1,fire:b.fire,pierce:b.pierce});
    if(trail.length>120) trail.shift();

    // walls
    if(b.x < b.r){ b.x=b.r; b.vx*=-1; wallHit(b); }
    if(b.x > W-b.r){ b.x=W-b.r; b.vx*=-1; wallHit(b); }
    if(b.y < b.r){ b.y=b.r; b.vy*=-1; wallHit(b); }

    // paddle
    if(b.vy>0 && b.y+b.r >= paddle.y - paddle.h/2 && b.y-b.r <= paddle.y+paddle.h/2 &&
       b.x >= paddle.x-paddle.w/2-b.r && b.x <= paddle.x+paddle.w/2+b.r && b.y < paddle.y+10){
      // catch power-up: grab the ball, let the player aim & fire once
      if(catchArmed > 0){
        catchArmed--;
        b.held = true; b.vx = 0; b.vy = 0;
        b.x = paddle.x; b.y = paddle.y - 16;
        aiming = true; aimAngle = -Math.PI/2; aimDir = 1;
        beep(520,0.08,'sine',0.16);
        spawnParticle(paddle.x, paddle.y-10, '#ff5bd0', 10, 4);
        continue;
      }
      b.y = paddle.y - paddle.h/2 - b.r;
      const rel = (b.x - paddle.x)/(paddle.w/2); // -1..1
      const sp = Math.min(11, Math.hypot(b.vx,b.vy)*1.01 + 0.05);
      const ang = -Math.PI/2 + rel*0.9;
      b.vx = Math.cos(ang)*sp; b.vy = Math.sin(ang)*sp;
      combo = 0; // reset combo on paddle hit (chain is brick->brick)
      beep(330,0.05,'square',0.13);
      spawnParticle(b.x, paddle.y-8, '#a25bff', 5, 3);
    }

    // bottom -> lose ball
    if(b.y - b.r > H){
      balls.splice(i,1);
      if(balls.length===0){ loseLife(); }
    }
  }

  // brick collisions
  for(const b of balls){
    for(const br of bricks){
      if(!br.alive) continue;
      if(b.x+b.r > br.x && b.x-b.r < br.x+br.w && b.y+b.r > br.y && b.y-b.r < br.y+br.h){
        // resolve axis
        const overlapL = (b.x+b.r) - br.x;
        const overlapR = (br.x+br.w) - (b.x-b.r);
        const overlapT = (b.y+b.r) - br.y;
        const overlapB = (br.y+br.h) - (b.y-b.r);
        const minO = Math.min(overlapL,overlapR,overlapT,overlapB);
        const through = b.fire || b.pierce;   // pass straight through bricks
        if(!through){
          if(minO===overlapT || minO===overlapB) b.vy*=-1; else b.vx*=-1;
        }
        hitBrick(br, b);
        if(!through) break;
      }
    }
  }

  // powerups fall
  for(let i=powerups.length-1;i>=0;i--){
    const p = powerups[i]; p.y += p.vy;
    if(p.y > paddle.y-paddle.h/2-p.r && p.y < paddle.y+20 && p.x>paddle.x-paddle.w/2-p.r && p.x<paddle.x+paddle.w/2+p.r){
      applyPowerup(p.type); powerups.splice(i,1); continue;
    }
    if(p.y > H+30) powerups.splice(i,1);
  }

  // win? -> reveal the full animal before next level
  if(bricks.every(br=>!br.alive)) { startReveal(); }

  decayEffects();
}

function wallHit(b){ beep(440,0.03,'sine',0.08); spawnParticle(b.x,b.y,'#3fd2ff',3,2.5); }

function hitBrick(br, ball){
  br.hp--;
  spawnParticle(br.x+br.w/2, br.y+br.h/2, br.color, 8, 4);
  if(br.hp>0){
    beep(520,0.04,'square',0.12);
    shake = Math.max(shake, 2);
    return;
  }
  br.alive = false;
  // combo
  combo++; comboTimer = 1.4;
  const gain = 50 * Math.max(1, combo);
  score += gain;
  if(score>hiScore){ hiScore=score; localStorage.setItem('db_hi',hiScore); }
  updateHUD();

  // juicy feedback
  spawnParticle(br.x+br.w/2, br.y+br.h/2, br.color, 18, 6);
  smallFloater('+'+gain, br.x+br.w/2, br.y, br.color);
  shake = Math.max(shake, 4 + Math.min(combo,10));
  flash = Math.max(flash, 0.12 + Math.min(combo*0.02,0.25));
  flashColor = hexToRgb(br.color);

  // rising pitch with combo
  const f = 440 * Math.pow(1.0595, Math.min(combo,24));
  beep(f, 0.08, 'square', 0.16);
  if(combo>=3){ showCombo(combo); }
  if(combo===5||combo===10||combo===15||combo>=20){
    bigFloater(combo>=20?'UNSTOPPABLE!':(combo>=15?'INSANE!':(combo>=10?'AMAZING!':'NICE!')),
      W/2, H*0.32, '#ffd23f');
    noiseBurst(0.12,0.18);
    for(let i=0;i<24;i++) spawnParticle(W/2,H*0.32,COLORS[i%6],1,8);
  }

  maybeDropPowerup(br.x+br.w/2, br.y+br.h/2);
}

function loseLife(){
  lives--;
  combo=0;
  updateHUD();
  shake=18; flash=0.5; flashColor='255,40,80';
  noiseBurst(0.25,0.3);
  beep(160,0.3,'sawtooth',0.2);
  if(lives<=0){ gameOver(); }
  else { resetBallOnPaddle(); }
}

function gameOver(){
  state='dead';
  const ov = document.getElementById('overlay');
  ov.innerHTML = '<h1>GAME OVER</h1>'+
    '<h2>SCORE '+score.toLocaleString()+'</h2>'+
    '<p>ハイスコア <span class="hi">'+hiScore.toLocaleString()+'</span> &nbsp; / &nbsp; LEVEL '+level+'</p>'+
    '<button id="btn">▶ RETRY</button>'+
    '<div id="hint">スペースキーでも再開</div>';
  ov.classList.remove('hidden');
  document.getElementById('btn').addEventListener('click', startGame);
}

function decayEffects(){
  if(shake>0) shake *= 0.86;
  if(shake<0.2) shake=0;
  if(flash>0) flash -= 0.04;
  if(flash<0) flash=0;
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.18; p.vx*=0.99; p.life-=0.025;
    if(p.life<=0) particles.splice(i,1);
  }
  for(let i=floaters.length-1;i>=0;i--){
    const f=floaters[i];
    f.y+=f.vy; f.life-=f.big?0.012:0.02;
    if(f.scale<1) f.scale += 0.15;
    if(f.life<=0) floaters.splice(i,1);
  }
  for(let i=trail.length-1;i>=0;i--){ trail[i].life-=0.04; if(trail[i].life<=0) trail.splice(i,1); }
}

function hexToRgb(hex){
  const n = parseInt(hex.slice(1),16);
  return ((n>>16)&255)+','+((n>>8)&255)+','+(n&255);
}

// ---------- Render ----------
function draw(){
  const sx = (Math.random()*2-1)*shake;
  const sy = (Math.random()*2-1)*shake;
  ctx.save();
  ctx.clearRect(-20,-20,W+40,H+40);

  // animated bg
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, `hsl(${(bgHue)%360}, 60%, 8%)`);
  g.addColorStop(1, `hsl(${(bgHue+60)%360}, 70%, 5%)`);
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

  // subtle grid
  ctx.strokeStyle='rgba(120,120,255,0.05)'; ctx.lineWidth=1;
  for(let x=0;x<W;x+=40){ ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke(); }
  for(let y=0;y<H;y+=40){ ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke(); }

  ctx.translate(sx,sy);

  // ---- hidden animal: neutral face on intact bricks, smile revealed underneath ----
  if(bricks.length){
    // grout fills the gaps so the layers read as tiles (and hides spoilers)
    ctx.fillStyle = 'rgba(12,7,24,0.96)';
    ctx.fillRect(0, regionTop, W, regionBottom - regionTop);
    // revealed SMILE under broken bricks (expanded to merge across the grout)
    for(const br of bricks){
      if(br.alive) continue;
      ctx.save();
      ctx.beginPath(); ctx.rect(br.x-4, br.y-4, br.w+8, br.h+8); ctx.clip();
      ctx.drawImage(picBack, 0,0, picBack.width, picBack.height, 0,0, W, PICH);
      ctx.restore();
    }
    // intact bricks: neutral face tile + colour wash + gloss + glowing frame
    for(const br of bricks){
      if(!br.alive) continue;
      ctx.save();
      roundRect(br.x, br.y, br.w, br.h, 5); ctx.clip();
      ctx.drawImage(picFront, 0,0, picFront.width, picFront.height, 0,0, W, PICH);
      ctx.fillStyle = 'rgba('+hexToRgb(br.color)+','+(0.22 + 0.18*(br.hp/br.maxhp))+')';
      ctx.fillRect(br.x, br.y, br.w, br.h);
      ctx.fillStyle='rgba(255,255,255,0.28)';
      ctx.fillRect(br.x+2, br.y+2, br.w-4, br.h*0.32);
      ctx.restore();
      ctx.strokeStyle = br.color; ctx.lineWidth = 2;
      ctx.shadowColor = br.color; ctx.shadowBlur = 10;
      roundRect(br.x+1, br.y+1, br.w-2, br.h-2, 5); ctx.stroke();
      ctx.shadowBlur = 0;
      if(br.maxhp>1){
        ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.font='bold 12px sans-serif';
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(br.hp, br.x+br.w/2, br.y+br.h/2);
      }
    }
  }

  // trail
  for(const t of trail){
    ctx.globalAlpha = t.life*0.5;
    ctx.fillStyle = t.fire? '#ff7b2e' : (t.pierce? '#3fd2ff' : '#fff');
    ctx.beginPath(); ctx.arc(t.x,t.y, 7*t.life, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;

  // balls
  for(const b of balls){
    const col = b.fire ? '#ffb02e' : (b.pierce ? '#7fe9ff' : '#fff');
    ctx.shadowColor = b.fire ? '#ff7b2e' : (b.pierce ? '#3fd2ff' : '#fff');
    ctx.shadowBlur = b.pierce ? 22 : 18;
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
  }

  // powerups
  for(const p of powerups){
    ctx.save();
    ctx.translate(p.x,p.y);
    ctx.shadowColor=powerColor(p.type); ctx.shadowBlur=16;
    ctx.fillStyle=powerColor(p.type);
    ctx.beginPath(); ctx.arc(0,0,p.r,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='#0a0a1a'; ctx.font='bold 14px sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(powerIcon(p.type),0,1);
    ctx.restore();
  }

  // paddle
  ctx.shadowColor='#a25bff'; ctx.shadowBlur=20;
  const pg = ctx.createLinearGradient(paddle.x-paddle.w/2,0,paddle.x+paddle.w/2,0);
  pg.addColorStop(0,'#ff2e88'); pg.addColorStop(0.5,'#a25bff'); pg.addColorStop(1,'#3fd2ff');
  ctx.fillStyle=pg;
  roundRect(paddle.x-paddle.w/2, paddle.y-paddle.h/2, paddle.w, paddle.h, 7); ctx.fill();
  ctx.shadowBlur=0;

  // particles
  for(const p of particles){
    ctx.globalAlpha = Math.max(0,p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;

  // floaters
  for(const f of floaters){
    ctx.globalAlpha=Math.max(0,f.life);
    ctx.fillStyle=f.color;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    const fs = (f.big?34:18)*f.scale;
    ctx.font='900 italic '+fs+'px sans-serif';
    ctx.shadowColor=f.color; ctx.shadowBlur=f.big?20:8;
    ctx.fillText(f.text,f.x,f.y);
    ctx.shadowBlur=0;
  }
  ctx.globalAlpha=1;

  // aiming arrow (shown whenever a ball is held on the paddle)
  if(aiming && state==='play' && !paused){
    const bx=paddle.x, by=paddle.y-16, len=80;
    const ex=bx+Math.cos(aimAngle)*len, ey=by+Math.sin(aimAngle)*len;
    ctx.save();
    ctx.globalAlpha=0.9; ctx.strokeStyle='#ff5bd0'; ctx.lineWidth=4; ctx.lineCap='round';
    ctx.shadowColor='#ff5bd0'; ctx.shadowBlur=12;
    ctx.setLineDash([7,7]);
    ctx.beginPath(); ctx.moveTo(bx,by); ctx.lineTo(ex,ey); ctx.stroke();
    ctx.setLineDash([]);
    const ah=13;
    ctx.beginPath();
    ctx.moveTo(ex,ey); ctx.lineTo(ex-Math.cos(aimAngle-0.4)*ah, ey-Math.sin(aimAngle-0.4)*ah);
    ctx.moveTo(ex,ey); ctx.lineTo(ex-Math.cos(aimAngle+0.4)*ah, ey-Math.sin(aimAngle+0.4)*ah);
    ctx.stroke();
    ctx.restore();
    ctx.globalAlpha = 0.5 + 0.5*Math.sin(Date.now()/200);
    ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.font='bold 15px sans-serif';
    ctx.fillText('タップ / SPACE でねらって発射', W/2, paddle.y-46);
    ctx.globalAlpha=1;
  }
  // catch power-up stock indicator
  if(catchArmed>0 && state==='play' && !aiming){
    ctx.globalAlpha=0.9; ctx.fillStyle='#ff5bd0'; ctx.textAlign='center'; ctx.font='bold 14px sans-serif';
    ctx.fillText('🎯 CATCH x'+catchArmed, paddle.x, paddle.y-26);
    ctx.globalAlpha=1;
  }

  ctx.restore();

  // flash overlay
  if(flash>0){
    ctx.fillStyle=`rgba(${flashColor},${flash*0.5})`;
    ctx.fillRect(0,0,W,H);
  }
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

// ---------- Loop ----------
let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now-last)/1000); last=now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
